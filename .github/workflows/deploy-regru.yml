name: Deploy event site to REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show changes without uploading
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: regru-event-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build website
        run: npm run build

      - name: Check FTP settings
        env:
          FTP_USERNAME: ${{ secrets.REGRU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.REGRU_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.REGRU_FTP_SERVER_DIR }}
        run: |
          set -eu
          for name in FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is missing. See README.md."
              exit 1
            fi
          done
          case "$FTP_SERVER_DIR" in
            /|/*/) ;;
            *) echo "::error::REGRU_FTP_SERVER_DIR must start and end with /."; exit 1 ;;
          esac

      - name: Configure application form
        env:
          APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwmVLiTCG7wNVzVdjbEFlc12zPIDSRy8HEfY03gUoeKFgFRYJ_PscX9SlU8XlBt--ickw/exec
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: node scripts/write-production-config.mjs

      - name: Publish website
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: server277.hosting.reg.ru
          username: ${{ secrets.REGRU_FTP_USERNAME }}
          password: ${{ secrets.REGRU_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ vars.REGRU_FTP_SERVER_DIR }}
          local-dir: ./regru-dist/
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify production form with a small file
        if: github.event_name == 'push' && github.event.head_commit.message == 'Verify production form'
        run: |
          printf 'Тестовый файл для проверки формы FFE.\n' > "$RUNNER_TEMP/ffe-resume.txt"
          status=$(curl --silent --show-error --max-time 40 \
            --output "$RUNNER_TEMP/ffe-form-response.txt" --write-out '%{http_code}' \
            --form 'name=ТЕСТ — проверка формы' \
            --form-string 'contact=@ffe_smoke_test' \
            --form 'cover_letter=Автоматическая проверка. Эту строку можно удалить.' \
            --form 'solution=Проверка записи в Google Таблицу и загрузки файла на Диск.' \
            --form 'consent=1' \
            --form "resume_file=@$RUNNER_TEMP/ffe-resume.txt;filename=ffe-smoke-test.txt;type=text/plain" \
            https://ffe-events.ru/api/submit.php)
          node -e 'const fs=require("fs"); const status=process.argv[1]; const body=fs.readFileSync(process.argv[2],"utf8"); let result; try { result=JSON.parse(body); } catch { console.error(`Form returned HTTP ${status}: ${body.slice(0,300)}`); process.exit(1); } if (status!=="200" || !result.ok || result.storage!=="google_sheet") { console.error(`Form returned HTTP ${status}: ${JSON.stringify(result)}`); process.exit(1); } console.log("Form accepted file and saved response to Google Sheet");' "$status" "$RUNNER_TEMP/ffe-form-response.txt"
